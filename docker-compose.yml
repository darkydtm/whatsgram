services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsgram}
      POSTGRES_USER: ${POSTGRES_USER:-whatsgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsgram}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE:-whatsgram:local}
    build:
      context: .
      platforms:
        - linux/amd64
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-whatsgram}:${POSTGRES_PASSWORD:-whatsgram}@postgres:5432/${POSTGRES_DB:-whatsgram}?sslmode=disable
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
