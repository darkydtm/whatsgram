# Pull-only deployment. Run: docker compose pull && docker compose up -d
# For local builds, run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  whatsgram:
    image: ${WHATSGRAM_IMAGE:-ghcr.io/darkydtm/whatsgram:latest}
    pull_policy: always
    container_name: whatsgram
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      - WHATSGRAM_TELEGRAM_TOKEN
      - WHATSGRAM_TELEGRAM_CHAT_ID
      - WHATSGRAM_TELEGRAM_ALLOWED_USER_IDS
      - WHATSGRAM_DATABASE_PATH=/data/whatsgram.db
      - TZ=UTC
    volumes:
      - ./data:/data
